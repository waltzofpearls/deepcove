<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}}</title>
<meta name="description" content="{{template "description" .}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script>
  // Runs before first paint so a stored choice never flashes the wrong theme.
  try {
    var stored = localStorage.getItem('theme');
    if (stored) document.documentElement.dataset.theme = stored;
  } catch (e) {}
</script>
</head>
<body>
<header class="header">
  <a class="brand" href="/" aria-label="deepcove home">
    <img class="logo-light" src="/assets/deepcove-logo-light.svg" alt="deepcove" height="36">
    <img class="logo-dark" src="/assets/deepcove-logo-dark.svg" alt="deepcove" height="36">
  </a>
  <button class="theme-toggle" type="button" title="Switch theme" aria-label="Switch theme">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
</header>

<main>
{{template "content" .}}
</main>

<footer class="footer">
  <p>Released under the Apache 2.0 license.</p>
  <p>&copy; 2026 Rollie Ma</p>
</footer>
<script>
  (function () {
    var root = document.documentElement;
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    var button = document.querySelector('.theme-toggle');
    // Revealed only once wired up, so the control is never present but dead.
    button.classList.add('ready');
    button.addEventListener('click', function () {
      var dark = root.dataset.theme ? root.dataset.theme === 'dark' : media.matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    });

    document.querySelectorAll('.command').forEach(function (command) {
      var copy = command.querySelector('.copy');
      var code = command.querySelector('code');
      if (!navigator.clipboard) return;
      copy.classList.add('ready');
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(code.textContent).then(function () {
          copy.textContent = 'Copied';
          setTimeout(function () { copy.textContent = 'Copy'; }, 1500);
        });
      });
    });
  })();
</script>
</body>
</html>
