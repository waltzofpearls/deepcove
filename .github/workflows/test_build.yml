name: test build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The build jobs need ui/build, and an artifact is the usual way to hand it over. This uses the
      # cache instead: same handoff, and it draws on the per-repo cache allowance rather than the
      # artifact one, which a few runs can exhaust for a whole billing cycle.
      - id: ui-cache
        uses: actions/cache@v4
        with:
          path: ui/build
          key: ui-build-${{ github.sha }}
      - uses: actions/setup-node@v6
        if: steps.ui-cache.outputs.cache-hit != 'true'
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        if: steps.ui-cache.outputs.cache-hit != 'true'
        run: npm ci
      - run: make ui-build
        if: steps.ui-cache.outputs.cache-hit != 'true'

  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    needs: ui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: macos-latest
            mingw: true
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: ui/build
          key: ui-build-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - if: matrix.mingw
        run: brew list mingw-w64 >/dev/null 2>&1 || brew install mingw-w64
      - run: make build-${{ matrix.os }}-${{ matrix.arch }}
      - run: make package OS=${{ matrix.os }} ARCH=${{ matrix.arch }}
