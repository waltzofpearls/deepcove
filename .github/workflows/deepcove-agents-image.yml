# Builds and pushes the deepcove-agents session image to GHCR, with every agent installed.
#
# Triggers:
#   workflow_dispatch — manual button in the Actions tab, for ad-hoc rebuilds.
#   tag push deepcove-agents-v* — versioned releases (e.g. `git tag deepcove-agents-v0.1.0`).
#   schedule — weekly, so a new session starts from recent agents and packages rather than
#   whatever was current at the last release. Only runs from the default branch.
#
# Tags pushed to GHCR:
#   latest            — from the default branch or a version tag only, so the agent registry's
#                       OfficialImage ref never points at a build of an unmerged branch.
#   <short-sha>       — every build, for traceability + rollback.
#   <version>         — only on tag push, stripped from the `deepcove-agents-v` prefix.
#
# After the first successful run, walk through Package Settings → Danger Zone →
# Change visibility → Public so sessions can pull without authentication.

name: deepcove-agents image

on:
  workflow_dispatch:
  schedule:
    # Mondays, off the top of the hour: GitHub queues scheduled runs there and drops some under load.
    - cron: '23 7 * * 1'
  push:
    tags:
      - 'deepcove-agents-v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/deepcove-agents
          TAGS="$IMAGE:${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" || "$GITHUB_REF" == refs/tags/deepcove-agents-v* ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/deepcove-agents-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/deepcove-agents-}"
            TAGS="$TAGS,$IMAGE:$VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deepcove-agents.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
