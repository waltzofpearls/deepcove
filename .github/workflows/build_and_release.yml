name: build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The tag being released names the archives and goes into the binary, so `deepcove upgrade` asks a
    # release for a file it has. git describe would answer with whatever tag it likes when a commit
    # carries more than one.
    env:
      VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: macos-latest
            mingw: true
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Linux builds the UI in its Dockerfile, the others build it here.
      - if: matrix.os != 'linux'
        uses: actions/setup-node@v7
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: matrix.os != 'linux'
        working-directory: ui
        run: npm ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - if: matrix.mingw
        run: brew list mingw-w64 >/dev/null 2>&1 || brew install mingw-w64
      - if: matrix.os == 'darwin'
        uses: Apple-Actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATES_PASSWORD }}
      - run: make build-${{ matrix.os }}-${{ matrix.arch }}
        env:
          CODE_SIGN_IDENTITY: "${{ matrix.os == 'darwin' && 'Developer ID Application: Ruo-Lei Ma (L2AR6TDY65)' || '' }}"
      - if: matrix.os == 'darwin'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: L2AR6TDY65
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: make notarize-darwin ARCH=${{ matrix.arch }}
      - run: make package OS=${{ matrix.os }} ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: deepcove-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          retention-days: 1

  # The VM artifacts are part of the release, so a downloaded deepcove finds everything it needs on its
  # own tag. Each file is named for its version, so the same name is always the same file: when an
  # earlier release already carries one, it is copied forward instead of built again.
  #
  # One job per architecture, on a runner of that architecture, because virtiofsd and passt are compiled
  # and nothing cross compiles. The versions come from internal/vmruntime/versions.json.
  vm-artifacts:
    name: vm artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # make regenerates versions.json when it looks older than its source, and a fresh checkout stamps
      # every file with the same time, so this job can end up running go generate.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Take what an earlier release already carries
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          tags=$(gh release list --limit 30 --json tagName --jq '.[].tagName')
          missing=""
          for artifact in guest-kernel cloud-hypervisor virtiofsd passt; do
            asset=$(jq -er --arg arch "${{ matrix.arch }}" \
              ".[\"${artifact//-/_}\"].assets[\$arch]" internal/vmruntime/versions.json)
            for tag in $tags; do
              if gh release download "$tag" --pattern "$asset" --dir dist/release 2>/dev/null; then
                echo "$asset came from $tag"
                break
              fi
            done
            if [ ! -f "dist/release/$asset" ]; then missing="$missing $artifact"; fi
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
      - name: Build what is missing
        if: steps.earlier.outputs.missing != ''
        run: make vm-artifacts VM_ARCH=${{ matrix.arch }} VM_ARTIFACTS="${{ steps.earlier.outputs.missing }}"
      - uses: actions/upload-artifact@v7
        with:
          name: deepcove-vm-${{ matrix.arch }}
          path: dist/release/*
          retention-days: 1

  publish:
    name: publish
    needs: [build, vm-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deepcove-*
          merge-multiple: true
          path: dist/release
      - run: make checksums
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
