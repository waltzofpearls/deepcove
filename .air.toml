root = "."
tmp_dir = "tmp"

[build]
  bin = "./deepcove"
  full_bin = "./deepcove start"
  cmd = "make build"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "testdata", "ui", "docs", "volumes", ".git", ".svelte-kit"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
